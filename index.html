        const quizData = [{"q": "Câu 1. Nguồn gốc lý luận quyết định bản chất tư tưởng Hồ Chí Minh là:", "a": ["A. Nho giáo", "B. Phật giáo", "C. Chủ nghĩa Mác-Lênin", "D. Chủ nghĩa dân tộc"], "c": 2, "e": ""}, {"q": "Câu 2. Theo Người, độc lập dân tộc phải đi đôi với:", "a": ["A. Tư bản chủ nghĩa", "B. Chủ nghĩa xã hội", "C. Phong kiến", "D. Quân chủ"], "c": 1, "e": ""}, {"q": "Câu 3. Giá trị truyền thống nào là cơ sở quan trọng nhất giúp Hồ Chí Minh xây dựng hệ thống quan điểm của mình?", "a": ["A. Chủ nghĩa yêu nước", "B. Tinh thần đoàn kết, cố kết cộng đồng", "C. Chủ nghĩa nhân văn của dân tộc", "D. Truyền thống cần cù, yêu lao động"], "c": 0, "e": ""}, {"q": "Câu 4. Luận điểm: “Dân ta có một lòng nồng nàn yêu nước. Đó là một truyền thống quý báu của ta. Từ xưa đến nay, mỗi khi Tổ quốc bị xâm lăng, thì tinh thần ấy lại sôi nổi, nó kết thành một làn sóng vô cùng mạnh mẽ, to lớn, nó lướt qua mọi sự nguy hiểm, khó khăn, nó nhấn chìm tất cả lũ bán nước và cướp nước” là của ai?", "a": ["A. Phan Bội Châu", "B. Phan Châu Trinh", "C. Hoàng Hoa Thám", "D. Hồ Chí Minh"], "c": 3, "e": ""}, {"q": "Câu 5. Cách mạng Tháng Mười Nga nổ ra vào năm nào?", "a": ["A. 1915", "B. 1916", "C. 1917", "D. 1918"], "c": 2, "e": ""}, {"q": "Câu 6. Quá trình hình thành và phát triển tư tưởng Hồ Chí Minh được chia thành mấy giai đoạn?", "a": ["A. 4 giai đoạn", "B. 5 giai đoạn", "C. 6 giai đoạn", "D. 7 giai đoạn"], "c": 1, "e": ""}, {"q": "Câu 7. Giá trị của tư tưởng Hồ Chí Minh đối với dân tộc là?", "a": ["A. Tài sản tinh thần vô giá của dân tộc Việt Nam", "B. Phản ánh khát vọng thời đại", "C. Tìm ra các giải pháp đấu tranh giải phóng loài người", "D. Cổ vũ các dân tộc đấu tranh trong sự nghiệp giải phóng"], "c": 0, "e": ""}, {"q": "Câu 8. Hồ Chí Minh bắt gặp \"Sơ thảo lần thứ nhất luận cương về những vấn đề dân tộc và vấn đề thuộc địa\" khi nào?", "a": ["A. 7/1920", "B. 12/1920", "C. 6/1923", "D. 2/1930"], "c": 0, "e": ""}, {"q": "Câu 9. Tư tưởng vị tha, từ bi bác ái, cứu khổ cứu nạn là ưu điểm của học thuyết, tôn giáo nào?", "a": ["A. Nho giáo", "B. Phật giáo", "C. Thiên chúa giáo", "D. Hồi giáo"], "c": 1, "e": ""}, {"q": "Câu 10. Đoạn trích sau đây thuộc tác phẩm nào của Hồ Chí Minh: “Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mạng nhất là chủ nghĩa Lênin”?", "a": ["A. Bản án chế độ thực dân Pháp", "B. Đường cách mệnh", "C. Con đường dẫn tôi đến chủ nghĩa Lênin", "D. Cương lĩnh chính trị đầu tiên"], "c": 2, "e": ""}, {"q": "Câu 11. Theo Hồ Chí Minh, trong cuộc cách mạng giải phóng dân tộc, lực lượng nào “là gốc cách mệnh”?", "a": ["A. Công nhân", "B. Trí thức", "C. Nông dân", "D. Công - nông"], "c": 3, "e": ""}, {"q": "Câu 12. Trong các luận điểm sau đây, luận điểm nào của Hồ Chí Minh?", "a": ["A. “Tất cả mọi người đều sinh ra có quyền bình đẳng. Tạo hóa cho họ những quyền không ai có thể xâm phạm được; trong những quyền ấy, có quyền được sống, quyền tự do và quyền mưu cầu hạnh phúc”", "B. “Người ta sinh ra tự do và bình đẳng về quyền lợi và phải luôn luôn được tự do và bình đẳng về quyền lợi”.", "C. “Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do”."], "c": 2, "e": ""}, {"q": "Câu 13. Theo Hồ Chí Minh, quá độ lên chủ nghĩa xã hội ở Việt Nam là quá độ:", "a": ["A. Trực tiếp lên chủ nghĩa xã hội", "B. Gián tiếp lên chủ nghĩa xã hội", "C. Đi thẳng lên chủ nghĩa xã hội", "D. Bỏ qua thời kỳ tư bản chủ nghĩa"], "c": 1, "e": ""}, {"q": "Câu 14. Bài thơ: \"Gạo đem vào giã bao đau đớn; Gạo giã xong rồi trăng tựa bông; Sống ở trên đời người cũng vậy, Gian nan rèn luyện mới thành công\". Bài thơ trên ở trong tác phẩm nào của Hồ Chí Minh?", "a": ["A. Ca binh lính", "B. Nhật ký trong tù", "C. Bài ca du kích", "D. Ca sợi chỉ."], "c": 1, "e": ""}, {"q": "Câu 15. Luận điểm: “Cách mệnh trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp ở mọi nơi. Đảng có vữ g sáng, vàng càng luyện càng trong\". Câu trên ở tác phẩm nào của Hồ Chí Minh?", "a": ["A. Đường Cách mệnh", "B. Đạo đức cách mạng", "C. Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân.", "D. Liên Xô vĩ đại."], "c": 1, "e": ""}, {"q": "Câu 80. “Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do”. Câu trên Hồ Chí Minh nói đó trong văn kiện nào?", "a": ["A. Tuyên ngôn độc lập (1945)", "B. Bản án chế độ thực dân Pháp", "C. Đường Cách mệnh", "D. Lời kêu gọi toàn quốc kháng chiến."], "c": 0, "e": ""}, {"q": "Câu 81. Theo Hồ Chí Minh, văn hóa có mối quan hệ như thế nào với chính trị?", "a": ["A. Văn hóa phải phục vụ nhiệm vụ chính trị", "B. Văn hóa mở đường cho chính trị phát triển.", "C. Văn hóa tồn tại độc lập với chính trị", "D. Văn hóa nằm trong chính trị"], "c": 3, "e": ""}, {"q": "Câu 82. Nói về văn hóa, Hồ Chí Minh chỉ rõ: “Văn hóa, nghệ thuật cũng là một mặt trận\"? Hãy xác định câu nói trên của người đề cập đến vấn đề gì sau đây:", "a": ["A. Vai trò và vị trí của văn hóa", "B. Chức năng của văn hóa", "C. Tính chất của văn hóa", "D. Vị trí của văn hóa"], "c": 0, "e": ""}, {"q": "Câu 83. Chọn câu trả lời đúng nhất với tư tưởng Hồ Chí Minh:", "a": ["A. Đảng cộng sản Việt Nam là đảng của giai cấp công nhân", "B. Đảng cộng sản Việt Nam là đảng của nhân dân lao động", "C. Đảng cộng sản Việt Nam là đảng của giai cấp công nhân, của nhân dân lao động và của dân tộc Việt Nam", "D. Đảng cộng sản Việt Nam là đảng của giai cấp lao động, mà cũng là đảng của toàn dân"], "c": 2, "e": ""}, {"q": "Câu 84. Trong bài ca Hòn đá (4/1942), Hồ Chí Minh viết: \"Biết đồng sức / Biết đồng lòng / Việc gì khó / Làm cũng xong\". Hãy xác định, bốn câu thơ trên của Người là nói về vấn đề gì sau đây:", "a": ["A. Vai trò của đại đoàn kết dân tộc", "B. Nguyên tắc xây dựng và hoạt động của đại đoàn kết dân tộc", "C. Nội dung của đại đoàn kết dân tộc", "D. Hình thức tổ chức của đại đoàn kết dân tộc"], "c": 0, "e": ""}, {"q": "Câu 85. Nói về đại đoàn kết dân tộc, Hồ Chí Minh khái quát: “Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công\". Hãy xác định, hai câu thơ trên của Người là nói về vấn đề gì sau đây:", "a": ["A. Nguyên tắc xây dựng và hoạt động của đại đoàn kết dân tộc", "B. Nội dung của đại đoàn kết dân tộc", "C. Vai trò của đại đoàn kết dân tộc", "D. Hình thức tổ chức của đại đoàn kết dân tộc"], "c": 2, "e": ""}, {"q": "Câu 86. “Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\". Câu trên trích từ tác phẩm nào?", "a": ["A. Đường Cách mệnh", "B. Sửa đổi lối làm việc", "C. Di chúc", "D. Hồ Chí Minh toàn tập, tập 5"], "c": 1, "e": ""}, {"q": "Câu 87. Những câu sau trích từ tác phẩm nào của Hồ Chí Minh? “Trời có bốn mùa: Xuân, Hạ, Thu, Đông / Đất có bốn phương: Đông, Tây, Nam, Bắc / Người có bốn đức: Cần, Kiệm, Liêm, Chính / Thiếu một mùa thì không thành trời / Thiếu một phương thì không thành đất\"", "a": ["A. Đạo đức cách mạng", "B. Bài nói chuyện tại trường Đại học nhân dân Việt Nam năm 1956", "C. Di chúc", "D. Hồ Chí Minh toàn tập"], "c": 3, "e": ""}, {"q": "Câu 88. Chọn cụm từ đúng điền vào chỗ trống. Theo Hồ Chí Minh, “Muốn cứu nước và ... không có con đường nào khác con đường...\"", "a": ["A. Giải phóng dân tộc; cách mạng vô sản", "B. Giải phóng dân tộc; cách mạng tư sản", "C. Giành độc lập; cách mạng vô sản", "D. Giành độc lập, tự do; cách mạng văn hóa"], "c": 0, "e": ""}, {"q": "Câu 89. Đại hội nào khẳng định: \"Đảng lấy chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cho hành động\"?", "a": ["A. Đại hội VII (1991)", "B. Đại hội VIII", "C. Đại hội IX (2001)", "D. Đại hội X (2006)"], "c": 0, "e": ""}, {"q": "Câu 90. Chọn cụm từ đúng điền vào chỗ trống theo Hồ Chí Minh: “Tôi chỉ có một ham muốn, ham muốn tột bậc, là làm sao cho nước ta hoàn toàn được ..., dân ta hoàn toàn tự do, đồng bào ta ai cũng có cơm ăn, áo mặc, ai cũng được học hành\"", "a": ["A. Nhanh chóng độc lập", "B. Thắng lợi", "C. Độc lập", "D. Giải phóng"], "c": 2, "e": ""}, {"q": "Câu 91. Theo Hồ Chí Minh, chủ nghĩa cộng sản thích ứng ở đâu dễ hơn?", "a": ["A. Ở các nước châu Âu", "B. Ở các nước tư bản phát triển nhất", "C. Ở Châu Phi", "D. Ở các nước châu Á"], "c": 3, "e": ""}, {"q": "Câu 92. Theo tư tưởng Hồ Chí Minh, luận điểm: Đảng Cộng sản Việt Nam là Đảng của giai cấp công nhân, đồng thời là Đảng của nhân dân lao động và của dân tộc Việt Nam nhằm:", "a": ["A. Xác định vị thế cầm quyền của Đảng", "B. Xác định bản chất của Đảng", "C. Xác định nguồn gốc ra đời của Đảng", "D. Xác định năng lực của Đảng"], "c": 1, "e": ""}, {"q": "Câu 93. Theo tư tưởng Hồ Chí Minh, Đảng Cộng sản Việt Nam là sản phẩm của sự kết hợp giữa chủ nghĩa Mác - Lênin, phong trào công nhân và...", "a": ["A. Phong trào giải phóng dân tộc", "B. Phong trào yêu nước", "C. Phong trào vì hòa bình", "D. Phong trào đoàn kết dân tộc"], "c": 1, "e": ""}, {"q": "Câu 94. Trong các giá trị truyền thống dân tộc Việt Nam hình thành nên tư tưởng Hồ Chí Minh, yếu tố nào giữ vị trí hàng đầu?", "a": ["A. Chủ nghĩa yêu nước", "B. Truyền thống đoàn kết", "C. Truyền thống ham học hỏi", "D. Truyền thống lao động cần cù, sáng tạo"], "c": 0, "e": ""}, {"q": "Câu 95. Giai đoạn hình thành cơ bản tư tưởng của Hồ Chí Minh về con đường cách mạng Việt Nam được tính từ:", "a": ["A. Trước năm 1911", "B. Từ năm 1911 đến năm 1920", "C. Từ năm 1920 đến năm 1930", "D. Từ năm 1930 đến năm 1945"], "c": 2, "e": ""}, {"q": "Câu 96. Theo giáo trình Tư tưởng Hồ Chí Minh, nguyên tắc phân phối chủ yếu trong chủ nghĩa xã hội là gì?", "a": ["A. Làm theo năng lực, hưởng theo nhu cầu.", "B. Làm theo năng lực, hưởng theo lao động.", "C. Phân phối bình quân cho tất cả mọi người.", "D. Làm ít hưởng vừa đủ"], "c": 1, "e": ""}, {"q": "Câu 97. Nói về đại đoàn kết dân tộc, Hồ Chí Minh chỉ rõ: \"Đoàn kết là sức mạnh của chúng ta. Đoàn kết chặt chẽ, thì chúng ta nhất định có thể khắc phục mọi khó khăn, phát triển mọi thuận lợi và làm trọn nhiệm vụ nhân dân giao phó\". Hãy xác định, luận điểm trên của Người là nói về vấn đề gì sau đây:", "a": ["A. Vai trò đoàn kết dân tộc", "B. Hình thức tổ chức của đại đoàn kết dân tộc", "C. Nguyên tắc xây dựng và hoạt động của đại đoàn kết dân tộc", "D. Nội dung của đại đoàn kết"], "c": 0, "e": ""}, {"q": "Câu 98. Chọn cụm từ điền vào chỗ trống: \"Văn hóa.........cho quốc dân đi\"", "a": ["A. Chỉ đường", "B. Mở đường", "C. Soi đường", "D. Dẫn đường"], "c": 2, "e": ""}, {"q": "Câu 99. Luận điểm \"Văn hóa phải soi đường cho quốc dân đi\" của Hồ Chí Minh đề cập đến vấn đề gì sau đây:", "a": ["A. Chức năng của văn hóa", "B. Tính chất của văn hóa", "C. Vai trò của văn hóa", "D. Đặc điểm của văn hóa"], "c": 2, "e": ""}, {"q": "Câu 100. Chọn phương án trả lời đúng nhất:", "a": ["A. Chủ nghĩa Mác - Lênin là nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng ta.", "B. Tư tưởng Hồ Chí Minh là nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng ta.", "C. Cùng với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh là nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng ta.", "D. Tư tưởng Hồ Chí Minh là tư tưởng toàn diện"], "c": 2, "e": ""}, {"q": "Câu 101. Theo Hồ Chí Minh, ưu điểm lớn nhất của học thuyết Khổng Tử là gì?", "a": ["A. Tinh thần hiếu học.", "B. Quản lý xã hội bằng đạo đức.", "C. Sự tu dưỡng đạo đức cá nhân.", "D. Tự do"], "c": 2, "e": ""}, {"q": "Câu 102. Quan điểm nào sau đây thể hiện đúng tư tưởng Hồ Chí Minh về bồi dưỡng thế hệ trẻ?", "a": ["A. Không cần giáo dục đạo đức", "B. Chỉ chú trọng kiến thức", "C. Kết hợp giáo dục toàn diện đức - trí - thể - mỹ", "D. Chỉ cần kỹ năng nghề"], "c": 2, "e": ""}, {"q": "Câu 103. Theo Hồ Chí Minh, vì sao phải tôn trọng và phát huy quyền làm chủ của nhân dân?", "a": ["A. Để giảm trách nhiệm Nhà nước", "B. Vì nhân dân là chủ thể sáng tạo lịch sử", "C. Vì yêu cầu quốc tế", "D. Vì yếu tố hình thức"], "c": 1, "e": ""}, {"q": "Câu 104. Yếu tố nào là cơ sở thế giới quan và phương pháp luận của tư tưởng Hồ Chí Minh:", "a": ["A. Tư tưởng Hồ Chí Minh", "B. Chủ nghĩa yêu nước", "C. Chủ nghĩa Mác - Lênin", "D. Tinh hoa văn hóa nhân loại"], "c": 2, "e": ""}, {"q": "Câu 105. Năm 1941, Nguyễn Ái Quốc viết một tác phẩm có câu mở đầu: “Dân ta phải biết sử ta / Cho tường gốc tích nước nhà Việt Nam”. Đó là tác phẩm:", "a": ["A. “Đường kách mệnh”", "B. “Lịch sử nước ta”", "C. “Bài ca du kích\"", "D. \"Di chúc\""], "c": 1, "e": ""}, {"q": "Câu 106. Luận điểm nào sau đây là sai? Tư tưởng Hồ Chí Minh bắt nguồn từ:", "a": ["A. Truyền thống đạo đức của dân tộc Việt Nam", "B. Yêu cầu của cách mạng", "C. Kế thừa tư tưởng đạo đức phương Đông và tinh hoa văn hóa nhân loại", "D. Tư tưởng đạo đức và những tấm gương của Mác, Ăngghen, Lênin"], "c": 3, "e": ""}, {"q": "Câu 107. Hãy lựa chọn câu trả lời đúng nhất:", "a": ["A. Hồ Chí Minh là anh hùng giải phóng dân tộc của Việt Nam", "B. Hồ Chí Minh là anh hùng giải phóng dân tộc của Việt Nam và danh nhân văn hóa kiệt xuất của thế giới.", "C. Hồ Chí Minh là anh hùng giải phóng dân tộc của Việt Nam và là một nhà văn hóa kiệt xuất", "D. Hồ Chí Minh là anh hùng giải phóng của dân tộc và là nhà văn hóa lớn của thế giới"], "c": 1, "e": ""}, {"q": "Câu 108. Chọn từ điền vào chỗ trống [.......] để hoàn thiện câu: Văn kiện Đại hội XI của Đảng chỉ rõ: Tư tưởng Hồ Chí Minh [.........] cho cuộc đấu tranh của nhân dân ta giành thắng lợi, là[......] to lớn của Đảng và dân tộc ta.", "a": ["A. Mở đường; tài sản tinh thần", "B. Soi đường; tài sản tinh thần", "C. Chỉ đường; tài sản tinh thần", "D. Dẫn đường; tài sản tinh thần"], "c": 1, "e": ""}, {"q": "Câu 109. Hồ Chí Minh xác định, cách mạng Việt Nam phải trải qua những thời kỳ nào?", "a": ["A. Cách mạng tư sản và cách mạng vô sản", "B. Cách mạng giải phóng dân tộc và cách mạng xã hội chủ nghĩa", "C. Cách mạng ruộng đất và cách mạng tư sản", "D. Cách mạng phong kiến và cách mạng vô sản"], "c": 1, "e": ""}, {"q": "Câu 110. Trong háng năm nào?", "a": ["A. 28/01/1941", "B. 28/01/1942", "C. 12/8/1942", "D. 19/12/1941"], "c": 0, "e": ""}, {"q": "Câu 145. Nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng và cách mạng Việt Nam là?", "a": ["A. Chủ nghĩa yêu nước", "B. Chủ nghĩa Mác - Lênin", "C. Tư tưởng Hồ Chí Minh", "D. Chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh"], "c": 3, "e": ""}, {"q": "Câu 146. Theo Hồ Chí Minh: [....] mở ra con đường giải phóng cho các dân tộc và cả loài người, mở đầu một thời đại mới trong lịch sử\". Hãy điền vào chỗ trống để hoàn thiện câu trên:", "a": ["A. Cách mạng tư sản Pháp", "B. Cách mạng Tân Hợi.", "C. Cách mạng Tháng Mười.", "D. Cách mạng Tháng Tám"], "c": 2, "e": ""}, {"q": "Câu 147. Tìm một phương án sai trong đoạn sau đây: “Trong 10 năm đầu (1911 – 1920) của quá trình bôn ba tìm đường cứu nước, Nguyễn Ái Quốc đã...", "a": ["A. Vượt qua 3 đại dương, 4 châu lục.", "B. Đến khoảng gần 30 nước.", "C. Sống, làm thuê và tự học tại các nước Mỹ, Anh, Pháp.", "D. Đến Mátxcơva và dự hội nghị quốc tế nông dân. (Sự kiện này diễn ra năm 1923)"], "c": 3, "e": ""}, {"q": "Câu 148. Hồ Chí Minh đã từng dạy học ở ngôi trường nào?", "a": ["A. Trường tiểu học Pháp – Việt ở Vinh", "B. Trường tiểu học Đông Ba ở Huế.", "C. Trường Quốc học Huế.", "D. Trường Dục Thanh ở Phan Thiết."], "c": 3, "e": ""}];
        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function initJumpSelect() {
            const select = document.getElementById('jump-select');
            quizData.forEach((_, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.text = `Chuyển đến Câu ${idx + 1}`;
                select.appendChild(opt);
            });
        }

        function jumpToQuestion() {
            const select = document.getElementById('jump-select');
            currentIdx = parseInt(select.value);
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            let cleanQ = q.q.replace(/^Câu\s*\d+[\.:\s]*/i, '');
            document.getElementById('q-text').innerText = `Câu ${currentIdx + 1}: ${cleanQ}`;
            document.getElementById('question-count').innerText = `Câu ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
            document.getElementById('jump-select').value = currentIdx;
            
            const list = document.getElementById('options-list');
            list.innerHTML = '';
            
            answered = false;
            document.getElementById('next-btn').disabled = true;

            q.a.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => checkAnswer(div, i);
                list.appendChild(div);
            });
        }

        function checkAnswer(el, idx) {
            if (answered) return;
            answered = true;
            const correctIdx = quizData[currentIdx].c;
            
            if (idx === correctIdx) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('wrong');
                const options = document.querySelectorAll('.option');
                if(options[correctIdx]) {
                    options[correctIdx].classList.add('correct');
                }
            }
            
            document.getElementById('score-display').innerText = `Đúng: ${score}`;
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            const screen = document.getElementById('result-screen');
            screen.style.display = 'block';
            document.getElementById('final-result').innerText = `${score}/${quizData.length}`;
            
            const percent = (score / quizData.length) * 100;
            let msg = "";
            if (percent >= 90) msg = "Quá xuất sắc! Bạn nắm bài rất vững.";
            else if (percent >= 70) msg = "Rất tốt! Khả năng qua môn rất cao.";
            else if (percent >= 50) msg = "Tạm ổn, hãy ôn kỹ hơn các câu làm sai nhé.";
            else msg = "Bạn cần cố gắng nhiều hơn để vượt qua kỳ thi.";
            document.getElementById('feedback').innerText = msg;
        }

        if(quizData.length > 0) {
            initJumpSelect();
            loadQuestion();
        } else {
            document.getElementById('q-text').innerText = "Không tìm thấy câu hỏi nào.";
        }
    </script>
